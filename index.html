<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مشروع اللعبة</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body class="bg-slate-100 text-slate-800 p-6">
    <div class="max-w-xl mx-auto bg-white p-6 rounded-2xl shadow-md">
        <h1 class="text-2xl font-bold text-center mb-6">تسجيل الدخول للمسابقة</h1>
        
        <div class="mb-4">
            <label class="block font-semibold mb-2">اسم الطالب:</label>
            <input type="text" class="w-full p-3 rounded-xl border border-slate-300 bg-white" placeholder="أدخل اسمك هنا">
        </div>

        <div class="mb-4">
            <label class="block font-semibold mb-2">اختر الصف الدراسي:</label>
            <select id="grade" name="grade" class="w-full p-3 rounded-xl border border-slate-300 bg-white text-slate-800 focus:outline-none focus:ring-2">
                <option value="" disabled selected>اختر الصف الدراسي</option>
                <option value="1">الصف الأول</option>
                <option value="2">الصف الثاني</option>
                <option value="3">الصف الثالث</option>
            </select>
        </div>
    </div>
</body>
</html>
